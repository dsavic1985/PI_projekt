
<div class="dashboard-container">
    <div class="main-logo">
        <img src="images/main_title.svg" alt="" class="app-logo">
    </div>

    <div class="dashboard">

        <div class="header">
            <a routerLink="/dashboard"><div class="back-icon"></div></a>
            <div class="logout-icon"></div>
        </div>

        <div class="dashboard-panel">
            <div class="inner-panel" >

                <div class="player-panel">
                    <div>
                        <p class="player-name">{{player.name}}</p>

                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <td>Poglavlje</td>
                                        <td>Razina</td>
                                        <td>Vrijeme</td>
                                        <td>Ocjena</td>
                                    </tr>
                                </thead>

                                <tbody>
                                    @for (session of gameSessions; track $index) {
                                    <tr>
                                        <td>{{session.chapter}}</td>
                                        <td>{{session.level}}</td>
                                        <td>{{session.durationSeconds | secondsToDurationString}}</td>
                                        <td>{{session.score}}/10</td>
                                    </tr>
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>
